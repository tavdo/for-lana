<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffe4e9">
  <meta name="description" content="პატარა რომანტიული ბარათი პატიების სათხოვნელად.">
  <title>მაპატიე</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.youtube.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ფონზე ნელა ამომავალი გულები -->
  <div class="floating-hearts" aria-hidden="true">
    <span>💗</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💕</span>
    <span>💗</span>
    <span>💖</span>
    <span>💕</span>
  </div>

  <!-- მუსიკის ჩართვა/გამორთვა -->
  <button type="button" id="mute-btn" class="mute-btn" aria-pressed="false" aria-label="მუსიკის გამორთვა">🔊</button>

  <main class="stage">
    <!-- 1. დახურული საჩუქარი ბარათი -->
    <section class="card screen is-active" id="screen-closed" aria-hidden="false">
      <div class="scene">
        <p class="bubble">მაპატიე</p>
        <div class="animals" aria-hidden="true">
          <span class="bear">🐻</span>
          <span class="panda">🐼</span>
        </div>
      </div>
      <p class="envelope" aria-hidden="true">💌</p>
      <h1 tabindex="-1">შენთვის რაღაც მაქვს</h1>
      <button type="button" id="open-btn" class="btn btn-primary">გახსენი</button>
    </section>

    <!-- 2. კითხვა -->
    <section class="card screen" id="screen-ask" aria-hidden="true">
      <h1 tabindex="-1">მაპატიებ? 🥺</h1>
      <p class="message">ვიცი, რომ გაგაბრაზე და ძალიან მენანება.</p>
      <div class="actions">
        <button type="button" id="yes-btn" class="btn btn-yes">კი, გაპატიებ 💖</button>
        <button type="button" id="no-btn" class="btn btn-no">არა</button>
      </div>
    </section>

    <!-- 3. მადლობა -->
    <section class="card screen" id="screen-thanks" aria-hidden="true">
      <p class="big-heart" aria-hidden="true">❤️</p>
      <h1 tabindex="-1">მადლობა, სიხარულო!</h1>
      <p class="message">მეტად აღარ გაგაბრაზებ. მიყვარხარ ძალიან 🥰</p>
    </section>
  </main>

  <!-- მადლობის ეკრანის გულების წვიმა -->
  <div class="heart-rain" id="heart-rain" aria-hidden="true"></div>

  <!-- YouTube ფლეიერის ადგილი. ეკრანის გარეთ გადის style.css-იდან -->
  <div id="yt-player" aria-hidden="true"></div>

  <!-- უსაფრთხო არეების გასაზომი უხილავი ჩარჩო -->
  <div id="safe-probe" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
